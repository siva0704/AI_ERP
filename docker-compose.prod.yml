version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_erp_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: aierp_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d aierp_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai_erp_api
    environment:
      DATABASE_URL: "postgresql://admin:password123@postgres:5432/aierp_prod?schema=public"
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai_erp_web
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api" 
      # Note: Browser accesses localhost:3001. 
      # For SSR, we might need internal docker network url, handling that usually requires distinct env var like INTERNAL_API_URL or config.
      # For now, assuming client-side fetch predominates or host networking logic.
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
