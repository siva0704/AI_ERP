version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_erp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      - postgres
    ports:
      - '3006:3001'
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/ai_erp?schema=public
      PORT: 3001
      NODE_ENV: production
      # Secure default for local docker, can be overridden by .env
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_that_is_at_least_32_chars_long}
      MOCK_MODE: 'false'
      STORAGE_DRIVER: 's3'
      S3_BUCKET: 'uploads'
      S3_REGION: 'us-east-1'
      S3_ENDPOINT: 'http://minio:9000'
      AWS_ACCESS_KEY_ID: 'minioadmin'
      AWS_SECRET_ACCESS_KEY: 'minioadmin'
    volumes:
      - ./uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    depends_on:
      - api
    ports:
      - '3005:3000'
    environment:
      NODE_ENV: production
      # Internal Docker Network URL for SSR
      API_URL: http://api:3001/api
      # Public URL for Client-Side (Browser)
      NEXT_PUBLIC_API_URL: http://localhost:3001/api

  minio:
    image: minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb myminio/uploads; /usr/bin/mc anonymous set public myminio/uploads; exit 0; "

volumes:
  pgdata:
  minio_data:
